<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <title>Audio test</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    body { margin: 0; padding: 20px 16px 40px; background: #10312b; color: #eee; font: 15px/1.4 -apple-system, system-ui, sans-serif; }
    h1 { font-size: 18px; margin: 0 0 6px; }
    p { margin: 0 0 14px; color: #bcc; font-size: 13px; }
    button { display: block; width: 100%; margin: 0 0 10px; padding: 14px; border: 0; border-radius: 12px;
      background: #e9d49a; color: #10312b; font: 600 16px system-ui, sans-serif; }
    a { color: #e9d49a; }
    pre { white-space: pre-wrap; word-break: break-word; background: rgba(0,0,0,.25); padding: 10px; border-radius: 10px;
      font: 12px/1.45 ui-monospace, Menlo, monospace; }
  </style>
</head>
<body>
  <h1>Audio test</h1>
  <p>Tap the buttons 1 to 4 in order, say after each one whether you heard a beep, then screenshot the text below.</p>
  <button id="b1">1. Beep (Web Audio)</button>
  <button id="b2">2. Beep + silent &lt;audio&gt;</button>
  <button id="b3">3. Decode 3 s of the stream</button>
  <button id="b4">4. Stream via &lt;audio&gt; + MediaSource</button>
  <p><a href="./">← back to the radio</a></p>
  <pre id="out"></pre>

<script>
(() => {
  const out = document.getElementById('out');
  const log = (s) => { out.textContent += s + '\n'; };
  const STREAM = 'https://live.vblcast.com/proxy/montecarlo/stream';
  const AC = window.AudioContext || window.webkitAudioContext;
  let ctx = null, silent = null;

  try { if (window.Telegram && Telegram.WebApp) { Telegram.WebApp.ready(); Telegram.WebApp.expand(); } } catch (e) {}

  const MMS = window.ManagedMediaSource, MS = window.MediaSource;
  const types = ['audio/mpeg', 'audio/mp4; codecs="mp4a.40.2"', 'audio/aac'];
  log('UA: ' + navigator.userAgent);
  log('Telegram: ' + (window.Telegram && Telegram.WebApp && Telegram.WebApp.initData ? 'yes ' + Telegram.WebApp.version + ' ' + Telegram.WebApp.platform : 'no'));
  log('AudioContext: ' + !!AC + ', audioSession: ' + (navigator.audioSession ? navigator.audioSession.type : 'none'));
  log('ManagedMediaSource: ' + !!MMS + (MMS ? ' ' + types.map((t) => t.split(';')[0] + '=' + MMS.isTypeSupported(t)).join(' ') : ''));
  log('MediaSource: ' + !!MS + (MS ? ' ' + types.map((t) => t.split(';')[0] + '=' + MS.isTypeSupported(t)).join(' ') : ''));
  log('');

  function getCtx() {
    if (!ctx) { ctx = new AC(); ctx.onstatechange = () => log('  ctx -> ' + ctx.state); }
    ctx.resume().then(() => log('  resume ok, ' + ctx.state + ' ' + ctx.sampleRate + ' Hz'), (e) => log('  resume failed: ' + e));
    return ctx;
  }

  function beep() {
    const c = getCtx(), o = c.createOscillator(), g = c.createGain();
    o.frequency.value = 660; g.gain.value = 0.25;
    o.connect(g); g.connect(c.destination);
    o.start(); o.stop(c.currentTime + 1);
    log('  beep scheduled, state ' + c.state + ', time ' + c.currentTime.toFixed(2));
  }

  function silentWav() {
    const n = 8000, b = new Uint8Array(44 + n), v = new DataView(b.buffer);
    const s = (o, t) => { for (let i = 0; i < t.length; i++) b[o + i] = t.charCodeAt(i); };
    s(0, 'RIFF'); v.setUint32(4, 36 + n, true); s(8, 'WAVE'); s(12, 'fmt '); v.setUint32(16, 16, true);
    v.setUint16(20, 1, true); v.setUint16(22, 1, true); v.setUint32(24, 8000, true); v.setUint32(28, 8000, true);
    v.setUint16(32, 1, true); v.setUint16(34, 8, true); s(36, 'data'); v.setUint32(40, n, true); b.fill(128, 44);
    let x = ''; for (const c of b) x += String.fromCharCode(c);
    return 'data:audio/wav;base64,' + btoa(x);
  }

  document.getElementById('b1').onclick = () => { log('1. Web Audio beep'); beep(); };

  document.getElementById('b2').onclick = () => {
    log('2. silent <audio> + beep');
    if (!silent) { silent = new Audio(silentWav()); silent.loop = true; }
    silent.play().then(() => log('  silent audio playing'), (e) => log('  silent audio failed: ' + e));
    beep();
  };

  document.getElementById('b3').onclick = async () => {
    log('3. fetch + decode');
    const c = getCtx();
    try {
      const r = await fetch(STREAM + '?_=' + Date.now(), { cache: 'no-store' });
      log('  HTTP ' + r.status + ', body stream: ' + !!r.body);
      const rd = r.body.getReader(); const parts = []; let n = 0;
      while (n < 48000) { const { done, value } = await rd.read(); if (done) break; parts.push(value); n += value.length; }
      rd.cancel();
      const u = new Uint8Array(n); let o = 0; for (const p of parts) { u.set(p, o); o += p.length; }
      log('  got ' + n + ' bytes');
      const buf = await new Promise((res, rej) => { const p = c.decodeAudioData(u.buffer, res, rej); if (p && p.catch) p.catch(rej); });
      log('  decoded ' + buf.duration.toFixed(2) + ' s, ' + buf.sampleRate + ' Hz, ' + buf.numberOfChannels + ' ch');
      const src = c.createBufferSource(), g = c.createGain(); g.gain.value = 0.3;
      src.buffer = buf; src.connect(g); g.connect(c.destination); src.start();
      log('  playing it at 30 % (should hear 3 s of radio)');
    } catch (e) { log('  ERROR ' + (e && e.name) + ': ' + (e && e.message)); }
  };

  document.getElementById('b4').onclick = async () => {
    log('4. MediaSource');
    const M = MMS || MS;
    if (!M) { log('  no MediaSource at all'); return; }
    const type = types.find((t) => M.isTypeSupported(t));
    if (type !== 'audio/mpeg') { log('  audio/mpeg not supported (' + type + '), would need a re-encode'); return; }
    const a = new Audio(); a.disableRemotePlayback = true;
    const ms = new M();
    a.src = URL.createObjectURL(ms);
    a.play().then(() => log('  <audio> playing'), (e) => log('  play: ' + e));
    ms.addEventListener('sourceopen', async () => {
      try {
        const sb = ms.addSourceBuffer('audio/mpeg');
        const r = await fetch(STREAM + '?_=' + Date.now(), { cache: 'no-store' });
        const rd = r.body.getReader(); let n = 0;
        while (n < 200000) {
          const { done, value } = await rd.read(); if (done) break;
          if (sb.updating) await new Promise((res) => sb.addEventListener('updateend', res, { once: true }));
          sb.appendBuffer(value); n += value.length;
        }
        rd.cancel();
        log('  appended ' + n + ' bytes, buffered ' + (sb.buffered.length ? sb.buffered.end(0).toFixed(1) : 0) + ' s');
      } catch (e) { log('  ERROR ' + (e && e.name) + ': ' + (e && e.message)); }
    }, { once: true });
  };
})();
</script>
</body>
